name: Blackjack

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: blackjack-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  blackjack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml requests

      - name: Debug event
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Issue number: ${{ github.event.issue.number }}"
          echo "Comment body: ${{ github.event.comment.body }}"
          echo "Issue title: ${{ github.event.issue.title }}"
          echo "Issue body: ${{ github.event.issue.body }}"

      - name: Check if blackjack game
        id: check
        run: |
          TITLE="${{ github.event.issue.title }}"
          BODY="${{ github.event.issue.body }}"
          COMMENT="${{ github.event.comment.body }}"
          
          # Check for blackjack trigger words
          if echo "$TITLE $BODY $COMMENT" | grep -qi "blackjack\|bet:"; then
            echo "is_game=true" >> $GITHUB_OUTPUT
          else
            echo "is_game=false" >> $GITHUB_OUTPUT
          fi

      - name: Run bot
        if: steps.check.outputs.is_game == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python -m blackjack_bot

      - name: Commit changes
        if: steps.check.outputs.is_game == 'true'
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Blackjack Bot"
          git add -A
          git diff --cached --quiet || git commit -m "♠️ Update blackjack state"
          git push